<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Volpi</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/fox-seal.svg" />
    <style>
      /* A plain page with no scripts. Colours follow src/styles/tokens.css (Day, and Night for dark systems). */
      :root { --paper: #f4efe4; --panel: #fffcf5; --ink: #1d1c21; --ink-2: #36332e; --seal: #c0383e; }
      @media (prefers-color-scheme: dark) { :root { --paper: #17161b; --panel: #211f26; --ink: #f4eee2; --ink-2: #ddd6c8; --seal: #e0676b; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 400 18px/1.7 system-ui, sans-serif; }
      main { max-width: 34em; border: 3px solid var(--ink); background: var(--panel); padding: 40px 32px; box-shadow: 8px 8px 0 var(--ink-2); }
      img { width: 44px; height: 44px; }
      p.code { margin: 20px 0 0; font: 400 13px/1 ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--seal); }
      h1 { margin: 8px 0 0; font: 600 clamp(2rem, 6vw, 2.8rem)/1.1 Georgia, serif; }
      p { color: var(--ink-2); }
      a { color: var(--ink); font-weight: 700; text-decoration-color: var(--seal); text-decoration-thickness: 2px; text-underline-offset: 6px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/brand/fox-seal.svg" alt="" width="44" height="44" />
      <p class="code">Error 404</p>
      <h1>This page is not here.</h1>
      <p>The link may be old, or there may be a typo in the address. Mochi says she did not eat it. She was very quick to say so.</p>
      <p><a href="/">Back to the home page</a> &nbsp;·&nbsp; <a href="/docs/">Documentation</a></p>
    </main>
  </body>
</html>
